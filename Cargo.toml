[package]
name = "cnctd_client"
version = "1.0.0-alpha.1"
edition = "2021"
authors = ["Connected Dot Inc.", "Kyle Ebner <kyle@cnctd.world>"]
description = "Client for servers built with the cnctd_server Rust crate: JSON envelopes over REST, the WebSocket with reconnect, push routing by channel, request/response over the socket"
repository = "https://github.com/Connected-Dot/cnctd_client"
license = "MIT"
keywords = ["module"]

[features]
default = ["rustls"]
# TLS for both HTTP and the WebSocket. Pick one. Neither installs a rustls
# crypto provider: a binary that also links a second provider (ring and
# aws-lc-rs through other crates) must call
# `rustls::crypto::ring::default_provider().install_default()` itself.
rustls = ["reqwest/rustls-tls", "tokio-tungstenite/rustls-tls-webpki-roots"]
native-tls = ["reqwest/native-tls", "tokio-tungstenite/native-tls"]

[dependencies]
# The wire types, shared with cnctd_server. No HTTP server library here.
cnctd_protocol = "1.0.0-alpha.1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
anyhow = "1"
# tests/live.rs runs the client against a real cnctd_server.
cnctd_server = "1.0.0-alpha.2"
tokio = { version = "1", features = ["full"] }
